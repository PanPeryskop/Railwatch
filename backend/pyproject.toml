readme = "README.md"
authors = [
    { name = "PanPeryskop", email = "stanislaw.gadek@o365.us.edu.pl" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
railwatch = "railwatch:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
